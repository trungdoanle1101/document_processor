[project]
name = "document-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
huggingface = [
    "hf-transfer>=0.1.9",
    "huggingface-hub>=2.3.0",
]
# the models: several GB, so only the processes that embed install them
embedding = [
    "sentence-transformers>=6.2,<7",
    "torch>=2.14.1",
    "transformers>=5.21.0,<6",
]
qdrant = [
    "qdrant-client>=1.20.0",
]


[build-system]
requires=["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_processor"]

[tool.ruff]
src = ["src", "apps/server/src", "apps/cli/src"]

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = ["src", "apps/server/src", "apps/cli/src"]

[tool.uv.workspace]
members = [
    "apps/server",
    "apps/cli",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
