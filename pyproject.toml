[project]
name = "document-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.2.0",
    "sentence-transformers>=6.2,<7",
    "torch>=2.14.1",
    "transformers>=5,<6",
]

[project.optional-dependencies]
huggingface = [
    "huggingface-hub>=2.3.0",
]
embedding = [
    "torch>=2.14.1",
    "transformers>=5.21.0",
]


[build-system]
requires=["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_processor"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
