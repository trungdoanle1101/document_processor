services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    # pinned to the qdrant-client version, which warns when the server's differs
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"  # HTTP: what the worker's client uses
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
